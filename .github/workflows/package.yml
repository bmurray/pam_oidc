name: Package
on:
  push: {}
jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install libraries
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build packages (deb, rpm)
        run: make packages

      - name: Build standalone .so (glibc) with real-PAM smoke test
        run: |
          docker build -f Dockerfile.release --output dist .
          mv dist/pam_oidc-linux-amd64-gnu.so "pam_oidc-$(hack/package_version.sh)-linux-amd64-gnu.so"

      - name: Checksums
        run: sha256sum libpam-oidc_*.deb pam_oidc-*.rpm pam_oidc-*.so | tee SHA256SUMS

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            libpam-oidc_*.deb
            pam_oidc-*.rpm
            pam_oidc-*-linux-amd64-gnu.so
            SHA256SUMS
