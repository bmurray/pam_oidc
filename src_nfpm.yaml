name: "pam_oidc"
arch: "amd64"
platform: "linux"
version: "${VERSION}"
description: |
  pam_oidc authenticates users with an OpenID Connect (OIDC) token.
vendor: "bmurray/pam_oidc (fork of salesforce/pam_oidc)"
homepage: "https://github.com/bmurray/pam_oidc"
license: "BSD-3-Clause"
contents:
  - src: pam_oidc.so
    dst: /usr/lib64/security/${VERSIONED_OIDC_LIB}
  - src: /usr/lib64/security/${VERSIONED_OIDC_LIB}
    dst: /usr/lib64/security/pam_oidc.so
    type: symlink
